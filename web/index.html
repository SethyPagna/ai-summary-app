<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="AI Summary — private, in-browser summaries, cited answers and study tools for your documents. Optional Claude mode with your own key." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>AI Summary</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ais2.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AI Summary needs JavaScript: all processing happens in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
